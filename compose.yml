services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linuxbasics
      POSTGRES_PASSWORD: linuxbasics_dev_password
      POSTGRES_DB: linuxbasics
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linuxbasics -d linuxbasics"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Host port 5433 — 5432 is often already taken by a locally installed Postgres.
      # DATABASE_URL below still uses 5432 since that's the container-internal port.
      - "5433:5432"

  backend:
    build:
      context: ./apps/backend/app
    environment:
      DATABASE_URL: postgresql+psycopg://linuxbasics:linuxbasics_dev_password@db:5432/linuxbasics
      SECRET_KEY: dev-secret-change-me
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8010"

  frontend:
    build:
      context: ./apps/frontend/app
    environment:
      # Reaches the browser, not other containers — must be the host-published backend port.
      VITE_API_URL: http://localhost:8010
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
